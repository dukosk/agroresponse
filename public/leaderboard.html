<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell">
    <nav class="topnav">
      <a href="/">Home</a>
      <a data-event-link href="/register.html">Register</a>
      <a data-event-link href="/queue.html">Queue</a>
      <a data-event-link href="/players.html">Players</a>
    </nav>

    <section class="panel">
      <p class="eyebrow" id="eventLabel">Event</p>
      <h1>Mission Rankings</h1>

      <div class="leaderboards">
        <div>
          <h2>Event Top 10</h2>
          <div class="ranking-list" id="eventRows"></div>
        </div>
        <div>
          <h2>Today Top 10</h2>
          <div class="ranking-list" id="todayRows"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const eventSlug = AgroApi.eventSlug();
    AgroApi.setEventLinks();
    document.getElementById('eventLabel').textContent = 'Event: ' + eventSlug;

    function rows(scores) {
      const top = scores.slice(0, 10);
      if (!top.length) return '<div class="empty-state">No scores yet.</div>';

      return top.map(function (row, index) {
        const medal = index === 0 ? ' gold' : index === 1 ? ' silver' : index === 2 ? ' bronze' : '';
        return '<div class="rank-row' + medal + '"><span class="rank-number">#' + (index + 1) + '</span>' +
          '<strong>' + AgroApi.escapeHtml(row.name) + '<br><span class="message">' +
          AgroApi.title(row.selected_map) + ' Mission</span></strong><span class="rank-score">' + row.score + '</span></div>';
      }).join('');
    }

    Promise.all([
      AgroApi.get('/api/leaderboard?event=' + encodeURIComponent(eventSlug)),
      AgroApi.get('/api/leaderboard/today?event=' + encodeURIComponent(eventSlug)),
    ])
      .then(function (results) {
        document.getElementById('eventRows').innerHTML = rows(results[0].event || []);
        document.getElementById('todayRows').innerHTML = rows(results[1].today || []);
      })
      .catch(function (error) {
        AgroApi.logError('Leaderboard API failed', error);
        document.getElementById('eventRows').innerHTML = '<div class="empty-state">Leaderboard could not be loaded.</div>';
        document.getElementById('todayRows').innerHTML = '<div class="empty-state">Today scores could not be loaded.</div>';
      });
  </script>
</body>
</html>
