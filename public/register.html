<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell">
    <nav class="topnav">
      <a href="/" data-i18n="home">Home</a>
      <a data-event-link data-i18n="queue" href="/queue.html">Queue</a>
      <a data-event-link data-i18n="leaderboard" href="/leaderboard.html">Leaderboard</a>
      <a data-event-link data-i18n="players" href="/players.html">Players</a>
    </nav>

    <section class="panel">
      <p class="eyebrow" id="eventLabel">Event</p>
      <h1 data-i18n="registerPilot">Register Pilot</h1>
      <div class="notice hidden" id="notice"></div>

      <form class="form" id="registerForm">
        <div class="form-grid">
          <label>
            <span data-i18n="name">Name</span>
            <input name="name" required maxlength="120" autocomplete="name">
          </label>

          <label>
            <span data-i18n="email">Email</span>
            <input name="email" type="email" required maxlength="180" autocomplete="email">
          </label>
        </div>

        <div>
          <p class="eyebrow" data-i18n="selectMissionMap">Select Mission Map</p>
          <div class="map-choice-grid" id="mapChoices"></div>
        </div>

        <button class="button primary" type="submit" data-i18n="joinQueue">Join Queue</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    const eventSlug = AgroApi.eventSlug();
    const params = new URLSearchParams(window.location.search);
    const form = document.getElementById('registerForm');
    const notice = document.getElementById('notice');
    const mapChoices = document.getElementById('mapChoices');
    let selectedMap = params.get('map') || 'orchard';
    let lastRegistrationResult = null;
    let lastRegistrationError = null;

    AgroApi.setEventLinks();
    function renderEventLabel() {
      document.getElementById('eventLabel').textContent = AgroI18n.t('eventLabel', { event: eventSlug });
    }
    renderEventLabel();

    const mapDescriptionKeys = {
      orchard: 'orchardChoiceDesc',
      forest: 'forestChoiceDesc',
      field: 'fieldChoiceDesc'
    };

    function renderMapChoices(maps) {
      mapChoices.innerHTML = maps.map(function (map) {
        const selected = map === selectedMap ? ' selected' : '';
        return '<label class="map-choice' + selected + '" style="--map-image: url(/img/' + map + '-aerial.png)">' +
          '<input type="radio" name="selected_map" value="' + AgroApi.escapeHtml(map) + '"' +
          (map === selectedMap ? ' checked' : '') + '>' +
          '<span class="selected-badge">' + AgroI18n.t('selected') + '</span>' +
          '<span class="map-choice-content"><span class="eyebrow">' + AgroI18n.t('missionMap') + '</span><h3>' + AgroApi.title(map) +
          '</h3><p>' + AgroI18n.t(mapDescriptionKeys[map]) + '</p></span></label>';
      }).join('');
    }

    function renderRegistrationSuccess(result) {
      const player = result.registration;
      notice.className = 'notice success';
      notice.innerHTML = '<div class="registration-result"><span>' + AgroI18n.t('queueNumber') + '</span><strong>#' +
        player.queue_number + '</strong><span>' + AgroI18n.t('selectedMission') + '</span><strong>' +
        AgroApi.title(player.selected_map) + '</strong><span>' + AgroI18n.t('playersBeforeYou') + '</span><strong>' +
        (result.playersBefore == null ? Math.max(0, (result.waitingPosition || 1) - 1) : result.playersBefore) + '</strong></div>' +
        '<p>' + AgroI18n.t('registeredForMission', {
          name: AgroApi.escapeHtml(player.name),
          map: AgroApi.title(player.selected_map)
        }) + '</p>' +
        '<div class="actions"><a class="button primary" href="/queue.html?event=' +
        encodeURIComponent(eventSlug) + '">' + AgroI18n.t('viewQueue') + '</a><a class="button" href="/">' + AgroI18n.t('home') + '</a></div>';
    }

    AgroApi.config().then(function (config) {
      if (!config.maps.includes(selectedMap)) selectedMap = config.maps[0];
      renderMapChoices(config.maps);
    });

    mapChoices.addEventListener('change', function (event) {
      if (event.target.name !== 'selected_map') return;
      selectedMap = event.target.value;
      mapChoices.querySelectorAll('.map-choice').forEach(function (choice) {
        choice.classList.toggle('selected', choice.querySelector('input').checked);
      });
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      data.event_slug = eventSlug;
      data.selected_map = selectedMap;

      AgroApi.post('/api/register', data)
        .then(function (result) {
          if (!result.ok) throw new Error(result.error);
          lastRegistrationResult = result;
          lastRegistrationError = null;
          form.reset();
          renderRegistrationSuccess(result);
        })
        .catch(function (error) {
          lastRegistrationResult = null;
          lastRegistrationError = error;
          notice.className = 'notice error';
          notice.textContent = AgroI18n.apiError(error, 'registrationFailed');
        });
    });

    window.addEventListener('agro:languagechange', function () {
      renderEventLabel();
      if (lastRegistrationResult) renderRegistrationSuccess(lastRegistrationResult);
      if (lastRegistrationError) notice.textContent = AgroI18n.apiError(lastRegistrationError, 'registrationFailed');
      AgroApi.config().then(function (config) {
        renderMapChoices(config.maps);
      });
    });
  </script>
</body>
</html>
