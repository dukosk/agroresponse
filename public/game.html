<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell game-shell">
    <nav class="topnav">
      <a href="/" data-i18n="home">Home</a>
      <a id="queueLink" href="/queue.html" data-i18n="queue">Queue</a>
      <a id="leaderboardLink" href="/leaderboard.html" data-i18n="leaderboard">Leaderboard</a>
      <a id="playersLink" href="/players.html" data-i18n="players">Players</a>
    </nav>

    <section class="game-layout">
      <div class="game-info">
        <p class="eyebrow" id="playerMeta" data-i18n="loadingPlayer">Loading player</p>
        <h1 id="playerName">Agro Drone Response</h1>
        <div class="stats">
          <span><span data-i18n="score">Score</span> <strong id="score">0</strong></span>
          <span><span data-i18n="time">Time</span> <strong id="time">60</strong>s</span>
        </div>
        <button class="button primary" id="startGame" type="button" disabled data-i18n="start">Start</button>
        <p class="hint" data-i18n="gameHint">Move with WASD or arrows. Press SPACE on a red target.</p>
        <div id="gameMessage" class="message"></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="960" height="960"></canvas>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
