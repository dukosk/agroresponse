<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Players | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell">
    <nav class="topnav">
      <a href="/" data-i18n="home">Home</a>
      <a data-event-link data-i18n="register" href="/register.html">Register</a>
      <a data-event-link data-i18n="queue" href="/queue.html">Queue</a>
      <a data-event-link data-i18n="leaderboard" href="/leaderboard.html">Leaderboard</a>
    </nav>

    <section class="panel">
      <div class="section-head">
        <div>
          <p class="eyebrow" id="eventLabel">Event</p>
          <h1 data-i18n="players">Players</h1>
        </div>
        <a class="button primary" id="exportCsv" data-i18n="exportCsv" href="/api/players.csv">Export CSV</a>
      </div>

      <div class="table-wrap admin-table">
        <table>
          <thead>
            <tr>
              <th data-i18n="queue">Queue</th>
              <th data-i18n="name">Name</th>
              <th data-i18n="email">Email</th>
              <th data-i18n="map">Map</th>
              <th data-i18n="status">Status</th>
              <th data-i18n="score">Score</th>
              <th data-i18n="registered">Registered</th>
            </tr>
          </thead>
          <tbody id="playersRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    const eventSlug = AgroApi.eventSlug();
    const rowsEl = document.getElementById('playersRows');
    let lastPlayers = null;

    AgroApi.setEventLinks();
    function renderPlayersEventLabel() {
      document.getElementById('eventLabel').textContent = AgroI18n.t('eventLabel', { event: eventSlug });
    }
    renderPlayersEventLabel();
    document.getElementById('exportCsv').href = '/api/players/export?event=' + encodeURIComponent(eventSlug);

    function statusBadge(status) {
      return '<span class="status-badge status-' + AgroApi.escapeHtml(status) + '">' + AgroI18n.status(status) + '</span>';
    }

    function renderPlayers(players) {
      lastPlayers = players;
      if (!players.length) {
        rowsEl.innerHTML = '<tr><td colspan="7">' + AgroI18n.t('noRegisteredPlayers') + '</td></tr>';
        return;
      }

      rowsEl.innerHTML = players.map(function (player) {
        return '<tr><td>#' + player.queue_number + '</td><td>' + AgroApi.escapeHtml(player.name) +
          '</td><td>' + AgroApi.escapeHtml(player.email) + '</td><td>' + AgroApi.title(player.selected_map) +
          '</td><td>' + statusBadge(player.status) + '</td><td>' + (player.score == null ? '-' : player.score) +
          '</td><td>' + AgroApi.escapeHtml(player.registered_at || player.created_at) + '</td></tr>';
      }).join('');
    }

    AgroApi.get('/api/players?event=' + encodeURIComponent(eventSlug))
      .then(function (data) {
        renderPlayers(data.players || []);
      })
      .catch(function (error) {
        AgroApi.logError('Players API failed', error);
        rowsEl.innerHTML = '<tr><td colspan="7">' + AgroI18n.t('playersLoadFailed') + '</td></tr>';
      });

    window.addEventListener('agro:languagechange', function () {
      renderPlayersEventLabel();
      if (lastPlayers) renderPlayers(lastPlayers);
    });
  </script>
</body>
</html>
