<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell queue-shell">
    <section class="queue-exhibit">
      <div class="queue-main">
        <div class="queue-topbar">
          <div>
            <p class="eyebrow" id="eventLabel">Event</p>
            <h1 data-i18n="liveMissionQueue">Live Mission Queue</h1>
          </div>
          <nav class="topnav">
            <a href="/" data-i18n="home">Home</a>
            <a data-event-link data-i18n="register" href="/register.html">Register</a>
            <a data-event-link data-i18n="leaderboard" href="/leaderboard.html">Leaderboard</a>
          </nav>
        </div>

        <div class="current-player" id="currentCard"></div>

        <div>
          <div class="next-player" id="nextCard"></div>
          <p class="message" id="queueMessage"></p>
        </div>
      </div>

      <div class="queue-side">
        <div class="current-leader" id="currentLeader"></div>

        <div class="waiting-list">
          <h2 data-i18n="waitingPilots">Waiting Pilots</h2>
          <div id="waitingRows"></div>
        </div>

        <div class="leaderboard-preview">
          <h2 data-i18n="todayTopScores">Today Top Scores</h2>
          <div id="leaderboardPreview"></div>
        </div>

        <div class="qr-compact">
          <img class="qr-code-img small" id="queueQr" data-i18n-alt="qrRegistration" alt="Registration QR code">
          <div>
            <strong data-i18n="register">Register</strong>
            <span id="queueRegisterUrl"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    const eventSlug = AgroApi.eventSlug();
    const currentCard = document.getElementById('currentCard');
    const nextCard = document.getElementById('nextCard');
    const waitingRows = document.getElementById('waitingRows');
    const leaderboardPreview = document.getElementById('leaderboardPreview');
    const currentLeader = document.getElementById('currentLeader');
    const message = document.getElementById('queueMessage');
    let lastQueueData = null;
    let lastLeaderData = null;
    let lastTodayData = null;

    AgroApi.setEventLinks();
    function renderQueueEventLabel() {
      document.getElementById('eventLabel').textContent = AgroI18n.t('eventLabel', { event: eventSlug });
    }
    renderQueueEventLabel();
    document.getElementById('queueRegisterUrl').textContent = window.location.origin + '/register.html?event=' + encodeURIComponent(eventSlug);
    document.getElementById('queueQr').src = '/api/register-qr.svg?event=' + encodeURIComponent(eventSlug);

    function playerCard(label, player, isCurrent) {
      if (!player) {
        if (isCurrent) {
          return '<div class="player-label">' + label + '</div><div class="player-name">' + AgroI18n.t('ready') + '</div>' +
            '<div class="player-meta">' + AgroI18n.t('callNextPilot') + '</div>';
        }
        return '<span class="player-label">' + label + '</span><strong>' + AgroI18n.t('noOneWaiting') + '</strong><div class="player-meta">' + AgroI18n.t('newPilotsAfterRegistration') + '</div>';
      }

      if (isCurrent) {
        return '<div class="player-label">' + label + '</div><div class="player-name">' + AgroApi.escapeHtml(player.name) +
          '</div><div class="player-meta">' + AgroI18n.t('queue') + ' #' + player.queue_number + ' · ' + AgroApi.title(player.selected_map) +
          ' ' + AgroI18n.t('mission') + '</div>';
      }
      return '<span class="player-label">' + label + '</span><strong>#' + player.queue_number + ' ' + AgroApi.escapeHtml(player.name) +
        '</strong><div class="player-meta">' + AgroApi.title(player.selected_map) + ' ' + AgroI18n.t('mission') + '</div>';
    }

    function renderQueue(data) {
      lastQueueData = data;
      currentCard.innerHTML = playerCard(AgroI18n.t('currentlyPlaying'), data.queue.current, true);
      nextCard.innerHTML = playerCard(AgroI18n.t('nextPlayer'), data.queue.next, false);

      if (!data.queue.waiting.length) {
        waitingRows.innerHTML = '<div class="empty-state">' + AgroI18n.t('noWaitingPlayers') + '</div>';
        return;
      }

      waitingRows.innerHTML = data.queue.waiting.map(function (player) {
        return '<div class="waiting-row"><span class="queue-number">#' + player.queue_number + '</span><strong>' +
          AgroApi.escapeHtml(player.name) + '</strong><span class="message">' + AgroApi.title(player.selected_map) +
          ' ' + AgroI18n.t('mission') + '</span></div>';
      }).join('');
    }

    function renderLeader(data) {
      lastLeaderData = data;
      const eventTop = (data.event || []).slice(0, 1);

      if (!eventTop.length) {
        currentLeader.innerHTML = '<h2>' + AgroI18n.t('currentLeader') + '</h2><div class="empty-state">' + AgroI18n.t('noLeaderYet') + '</div>';
      } else {
        const leader = eventTop[0];
        currentLeader.innerHTML = '<h2>' + AgroI18n.t('currentLeader') + '</h2><div class="leader-card"><strong>' +
          AgroApi.escapeHtml(leader.name) + '</strong><span class="rank-score">' + leader.score +
          '</span><span class="message">' + AgroApi.title(leader.selected_map) + ' ' + AgroI18n.t('mission') + '</span></div>';
      }
    }

    function renderTodayScores(data) {
      lastTodayData = data;
      const top = (data.today || []).slice(0, 5);
      if (!top.length) {
        leaderboardPreview.innerHTML = '<div class="empty-state">' + AgroI18n.t('noScoresToday') + '</div>';
        return;
      }

      leaderboardPreview.innerHTML = top.map(function (row, index) {
        return '<div class="preview-row"><span class="rank-number">' + (index + 1) + '</span><strong>' +
          AgroApi.escapeHtml(row.name) + '</strong><span class="rank-score">' + row.score + '</span></div>';
      }).join('');
    }

    function refreshQueue() {
      AgroApi.get('/api/queue?event=' + encodeURIComponent(eventSlug))
        .then(renderQueue)
        .catch(function (error) {
          AgroApi.logError('Queue API failed', error);
          message.textContent = AgroI18n.t('queueLoadFailed');
        });
      AgroApi.get('/api/leaderboard?event=' + encodeURIComponent(eventSlug))
        .then(renderLeader)
        .catch(function (error) {
          AgroApi.logError('Queue leader API failed', error);
          currentLeader.innerHTML = '<h2>' + AgroI18n.t('currentLeader') + '</h2><div class="empty-state">' + AgroI18n.t('leaderLoadFailed') + '</div>';
        });
      AgroApi.get('/api/leaderboard/today?event=' + encodeURIComponent(eventSlug))
        .then(renderTodayScores)
        .catch(function (error) {
          AgroApi.logError('Queue today leaderboard API failed', error);
          leaderboardPreview.innerHTML = '<div class="empty-state">' + AgroI18n.t('todayScoresLoadFailed') + '</div>';
        });
    }

    refreshQueue();
    window.setInterval(refreshQueue, 3000);
    window.addEventListener('agro:languagechange', function () {
      renderQueueEventLabel();
      if (lastQueueData) renderQueue(lastQueueData);
      if (lastLeaderData) renderLeader(lastLeaderData);
      if (lastTodayData) renderTodayScores(lastTodayData);
    });
  </script>
</body>
</html>
