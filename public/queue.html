<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue | Agro Drone Response</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="shell queue-shell">
    <section class="queue-exhibit">
      <div class="queue-main">
        <div class="queue-topbar">
          <div>
            <p class="eyebrow" id="eventLabel">Event</p>
            <h1>Live Mission Queue</h1>
          </div>
          <nav class="topnav">
            <a href="/">Home</a>
            <a data-event-link href="/register.html">Register</a>
            <a data-event-link href="/leaderboard.html">Leaderboard</a>
            <a data-event-link href="/players.html">Players</a>
          </nav>
        </div>

        <div class="current-player" id="currentCard"></div>

        <div>
          <div class="next-player" id="nextCard"></div>
          <div class="inline-actions">
            <button class="button primary" id="callNext" type="button">Call Next Player</button>
            <button class="button" id="finishCurrent" type="button">Mark Current Finished</button>
          </div>
          <p class="message" id="queueMessage"></p>
        </div>
      </div>

      <div class="queue-side">
        <div class="current-leader" id="currentLeader"></div>

        <div class="waiting-list">
          <h2>Waiting Pilots</h2>
          <div id="waitingRows"></div>
        </div>

        <div class="leaderboard-preview">
          <h2>Today Top Scores</h2>
          <div id="leaderboardPreview"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const eventSlug = AgroApi.eventSlug();
    const currentCard = document.getElementById('currentCard');
    const nextCard = document.getElementById('nextCard');
    const waitingRows = document.getElementById('waitingRows');
    const leaderboardPreview = document.getElementById('leaderboardPreview');
    const currentLeader = document.getElementById('currentLeader');
    const message = document.getElementById('queueMessage');

    AgroApi.setEventLinks();
    document.getElementById('eventLabel').textContent = 'Event: ' + eventSlug;

    function playerCard(label, player, isCurrent) {
      if (!player) {
        if (isCurrent) {
          return '<div class="player-label">' + label + '</div><div class="player-name">Ready</div>' +
            '<div class="player-meta">Call the next pilot</div>';
        }
        return '<span class="player-label">' + label + '</span><strong>No one waiting</strong><div class="player-meta">New pilots appear after registration</div>';
      }

      const gameLink = isCurrent ? '<a class="button primary" href="/game.html?id=' + player.id + '">Start Game</a>' : '';
      const skipButton = isCurrent ? '<button class="button muted" data-skip="' + player.id + '" type="button">Skip Player</button>' : '';
      if (isCurrent) {
        return '<div class="player-label">' + label + '</div><div class="player-name">' + AgroApi.escapeHtml(player.name) +
          '</div><div class="player-meta">Queue #' + player.queue_number + ' · ' + AgroApi.title(player.selected_map) +
          ' Mission</div><div class="actions">' + gameLink + skipButton + '</div>';
      }
      return '<span class="player-label">' + label + '</span><strong>#' + player.queue_number + ' ' + AgroApi.escapeHtml(player.name) +
        '</strong><div class="player-meta">' + AgroApi.title(player.selected_map) + ' Mission</div>';
    }

    function renderQueue(data) {
      currentCard.innerHTML = playerCard('Currently Playing', data.queue.current, true);
      nextCard.innerHTML = playerCard('Next Player', data.queue.next, false);

      if (!data.queue.waiting.length) {
        waitingRows.innerHTML = '<div class="empty-state">No waiting players.</div>';
        return;
      }

      waitingRows.innerHTML = data.queue.waiting.map(function (player) {
        return '<div class="waiting-row"><span class="queue-number">#' + player.queue_number + '</span><strong>' +
          AgroApi.escapeHtml(player.name) + '</strong><button class="button small" data-skip="' + player.id +
          '" type="button">Skip</button><span></span><span class="message">' + AgroApi.title(player.selected_map) +
          ' Mission</span><span></span></div>';
      }).join('');
    }

    function renderLeader(data) {
      const eventTop = (data.event || []).slice(0, 1);

      if (!eventTop.length) {
        currentLeader.innerHTML = '<h2>Current Leader</h2><div class="empty-state">No leader yet.</div>';
      } else {
        const leader = eventTop[0];
        currentLeader.innerHTML = '<h2>Current Leader</h2><div class="leader-card"><strong>' +
          AgroApi.escapeHtml(leader.name) + '</strong><span class="rank-score">' + leader.score +
          '</span><span class="message">' + AgroApi.title(leader.selected_map) + ' Mission</span></div>';
      }
    }

    function renderTodayScores(data) {
      const top = (data.today || []).slice(0, 5);
      if (!top.length) {
        leaderboardPreview.innerHTML = '<div class="empty-state">No scores today yet.</div>';
        return;
      }

      leaderboardPreview.innerHTML = top.map(function (row, index) {
        return '<div class="preview-row"><span class="rank-number">' + (index + 1) + '</span><strong>' +
          AgroApi.escapeHtml(row.name) + '</strong><span class="rank-score">' + row.score + '</span></div>';
      }).join('');
    }

    function refreshQueue() {
      AgroApi.get('/api/queue?event=' + encodeURIComponent(eventSlug))
        .then(renderQueue)
        .catch(function (error) {
          AgroApi.logError('Queue API failed', error);
          message.textContent = 'Queue could not be loaded.';
        });
      AgroApi.get('/api/leaderboard?event=' + encodeURIComponent(eventSlug))
        .then(renderLeader)
        .catch(function (error) {
          AgroApi.logError('Queue leader API failed', error);
          currentLeader.innerHTML = '<h2>Current Leader</h2><div class="empty-state">Leader could not be loaded.</div>';
        });
      AgroApi.get('/api/leaderboard/today?event=' + encodeURIComponent(eventSlug))
        .then(renderTodayScores)
        .catch(function (error) {
          AgroApi.logError('Queue today leaderboard API failed', error);
          leaderboardPreview.innerHTML = '<div class="empty-state">Today scores could not be loaded.</div>';
        });
    }

    function queueAction(path, body) {
      message.textContent = '';
      return AgroApi.post(path, body)
        .then(function (result) {
          if (!result.ok) throw new Error(result.error);
          refreshQueue();
        })
        .catch(function (error) {
          message.textContent = error.message || 'Queue action failed.';
          refreshQueue();
        });
    }

    document.getElementById('callNext').addEventListener('click', function () {
      queueAction('/api/queue/call-next', { event_slug: eventSlug });
    });

    document.getElementById('finishCurrent').addEventListener('click', function () {
      queueAction('/api/queue/finish-current', { event_slug: eventSlug });
    });

    document.addEventListener('click', function (event) {
      const button = event.target.closest('[data-skip]');
      if (!button) return;
      queueAction('/api/queue/skip-player', { event_slug: eventSlug, id: button.dataset.skip });
    });

    refreshQueue();
    window.setInterval(refreshQueue, 3000);
  </script>
</body>
</html>
